<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b3a1a">
<meta name="description" content="Sandbag Siege - tower defense: build gun emplacements and defend your HQ.">
<title>Sandbag Siege</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%234f6b22'/%3E%3Cpath d='M32 10l6 14h15l-12 9 5 15-14-9-14 9 5-15-12-9h15z' fill='%23ffd447'/%3E%3C/svg%3E">
<style>
:root{--ad-h:0px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1b2412;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;touch-action:none;overscroll-behavior:none;color:#fff}
#app{position:relative;margin:0 auto;width:100%;max-width:520px;height:100%;overflow:hidden;background:#3b4a26}
#cv{position:absolute;left:0;top:0;width:100%;height:calc(100% - var(--ad-h));display:block;touch-action:none}
#ad-slot{position:absolute;left:0;right:0;bottom:0;height:var(--ad-h);background:#0d120a;z-index:20}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(6px + var(--st)) 6px 0;display:none;gap:5px;align-items:center;z-index:5;pointer-events:none}
.hud.on{display:flex}
.pill{pointer-events:auto;background:rgba(18,26,10,.8);border:2px solid rgba(255,255,255,.14);border-radius:13px;height:38px;display:flex;align-items:center;gap:5px;padding:0 9px;font-weight:900;font-size:16px;white-space:nowrap}
.ibtn{width:42px;justify-content:center;padding:0;cursor:pointer;font-size:15px}
.grow{flex:1}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffd23a 45%,#d99a10);border:2px solid #a86d00;flex:none}
.heart{color:#ff5a5a;font-size:19px;line-height:1}
.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.2)}}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bottom{position:absolute;left:0;right:0;bottom:calc(var(--ad-h) + 8px + var(--sb));display:none;justify-content:center;gap:8px;padding:0 8px;z-index:5;pointer-events:none}
.bottom.on{display:flex}
.btn{pointer-events:auto;border:0;border-radius:14px;font:inherit;font-weight:900;font-size:17px;color:#fff;padding:0 18px;min-height:50px;cursor:pointer;background:linear-gradient(#ffb43a,#e8820c);box-shadow:0 4px 0 #9b5300,0 6px 12px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(0,0,0,.35);line-height:1.15}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9b5300}
.btn.g{background:linear-gradient(#86d943,#4f9a1e);box-shadow:0 4px 0 #2e6410,0 6px 12px rgba(0,0,0,.35)}
.btn.gr{background:linear-gradient(#83907a,#596452);box-shadow:0 4px 0 #353d2f,0 6px 12px rgba(0,0,0,.35)}
.btn.r{background:linear-gradient(#ff7a5a,#d33d24);box-shadow:0 4px 0 #8a2010,0 6px 12px rgba(0,0,0,.35)}
.btn.b{background:linear-gradient(#5cc2ff,#2a83d6);box-shadow:0 4px 0 #17508a,0 6px 12px rgba(0,0,0,.35)}
.btn[disabled]{filter:grayscale(1);opacity:.55}
.btn small{display:block;font-size:12px;font-weight:800;opacity:.95}
#waveBtn{min-width:200px}
#waveBtn.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.sheet{position:absolute;left:6px;right:6px;bottom:calc(var(--ad-h) + 6px + var(--sb));background:rgba(26,34,16,.97);border:2px solid #8a7a4a;border-radius:18px;padding:9px 9px 10px;z-index:8;transform:translateY(130%);transition:transform .16s ease-out;box-shadow:0 -4px 18px rgba(0,0,0,.4)}
.sheet.on{transform:none}
.sh-h{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:17px;margin:0 2px 7px}
.x{width:34px;height:30px;border-radius:10px;border:0;background:#4a5534;color:#fff;font-weight:900;font-size:16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{background:linear-gradient(#4f5f31,#36421f);border:2px solid #74854a;border-radius:12px;padding:4px 2px 5px;text-align:center;cursor:pointer}
.card canvas{width:48px;height:48px;display:block;margin:0 auto}
.card .nm{font-size:12px;font-weight:800;line-height:1.1;min-height:27px;display:flex;align-items:center;justify-content:center;padding:0 2px}
.card .pr{font-size:14px;font-weight:900;color:#ffd447;display:flex;gap:3px;align-items:center;justify-content:center}
.card .pr .coin{width:13px;height:13px;border-width:1.5px}
.card.no{opacity:.5;filter:grayscale(.85)}
.card.no .pr{color:#ff9a8a}
.tp{display:flex;gap:10px;align-items:center}
.tp canvas{width:64px;height:64px;flex:none}
.stats{font-size:13px;line-height:1.45;flex:1}
.stats b{color:#ffd447}
.desc{font-size:12px;opacity:.85;margin-top:2px}
.row{display:flex;gap:8px;margin-top:8px}
.row .btn{flex:1;min-height:48px;font-size:15px}
.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;padding:calc(14px + var(--st)) 16px calc(14px + var(--ad-h) + var(--sb))}
.screen.on{display:flex}
#title{background:linear-gradient(rgba(10,16,6,.25),rgba(10,16,6,.05) 40%,rgba(10,16,6,.55))}
#logo{width:340px;max-width:94%;height:auto;margin-top:4px}
.sub{font-weight:900;font-size:20px;margin-top:-2px;text-shadow:0 2px 0 #000,0 0 10px #000;color:#fff3c4}
.col{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;margin-top:auto}
.col .btn{width:100%}
#maps{background:rgba(16,22,10,.92);overflow-y:auto}
h2{margin:6px 0 12px;font-size:24px;text-shadow:0 2px 0 #000}
.mcard{width:100%;max-width:340px;display:flex;gap:10px;align-items:center;background:linear-gradient(#4f5f31,#36421f);border:2px solid #74854a;border-radius:16px;padding:8px;margin-bottom:10px;cursor:pointer}
.mcard canvas{width:76px;height:120px;border-radius:10px;flex:none;border:2px solid rgba(0,0,0,.4)}
.mcard .mn{font-weight:900;font-size:19px}
.mcard .ms{font-size:13px;opacity:.85;margin:2px 0 4px}
.stars{font-size:24px;letter-spacing:2px;color:#4a4a3a}
.stars .on{color:#ffd447;text-shadow:0 0 6px rgba(255,200,40,.7)}
.mcard.lock{opacity:.5;filter:grayscale(.9);cursor:default}
.modal{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
.modal.on{display:flex}
.box{width:100%;max-width:340px;background:linear-gradient(#3d4a26,#28311a);border:3px solid #a8935a;border-radius:20px;padding:16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);max-height:94%;overflow-y:auto}
.box h3{margin:0 0 10px;font-size:24px;text-shadow:0 2px 0 #000}
.box .btn{width:100%;margin-top:10px}
.bigstars{font-size:52px;letter-spacing:4px;color:#4a4a3a;margin:2px 0 6px}
.bigstars span{display:inline-block;transform:scale(0)}
.bigstars span.on{color:#ffd447;text-shadow:0 0 12px rgba(255,200,40,.8)}
.bigstars span.in{animation:starin .4s forwards}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-weight:800;font-size:16px;text-align:left}
.seg{display:flex;gap:6px}
.seg button{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:900;background:#556142;color:#fff;cursor:pointer}
.seg button.on{background:#ffb43a;color:#3a2200}
input[type=range]{width:140px;accent-color:#ffb43a}
.how{text-align:left;font-size:15px;line-height:1.45;padding-left:20px;margin:6px 0}
.how li{margin-bottom:6px}
#toast{position:absolute;top:calc(56px + var(--st));left:50%;transform:translateX(-50%);background:rgba(15,20,8,.9);border:2px solid #ffd447;color:#fff;font-weight:900;padding:7px 14px;border-radius:12px;z-index:12;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;font-size:15px}
#toast.on{opacity:1}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-weight:900;font-size:40px;z-index:9;pointer-events:none;color:#ffd447;-webkit-text-stroke:2px #3a1d00;text-shadow:0 4px 0 #3a1d00,0 0 20px rgba(0,0,0,.6);opacity:0;transform:scale(.6);transition:all .25s}
#banner.on{opacity:1;transform:scale(1)}
#banner.red{color:#ff6a4a}
.ver{font-size:11px;opacity:.6;margin-top:8px}
@media (max-height:660px){#logo{width:270px}.col{gap:8px}.btn{min-height:44px}}
</style>
</head>
<body>
<div id="app">
<canvas id="cv"></canvas>
<div class="hud" id="hud">
 <div class="pill ibtn" id="bPause" aria-label="pause">II</div>
 <div class="pill" id="livesPill"><span class="heart">&#9829;</span><span id="lives">20</span></div>
 <div class="pill" id="coinPill"><span class="coin" id="coinIco"></span><span id="coins">0</span></div>
 <div class="grow"></div>
 <div class="pill" id="wavePill"><span data-t="Wave">Wave</span>&nbsp;<span id="wave">0/10</span></div>
 <div class="pill ibtn" id="bSpeed">1x</div>
</div>
<div class="bottom" id="bottom"><button class="btn g" id="waveBtn">Start wave</button></div>
<div class="sheet" id="buildSheet">
 <div class="sh-h"><span data-t="Build a gun">Build a gun</span><button class="x" id="bsX">X</button></div>
 <div class="grid" id="buildGrid"></div>
</div>
<div class="sheet" id="towSheet">
 <div class="sh-h"><span id="tsName">Rifleman</span><button class="x" id="tsX">X</button></div>
 <div class="tp"><canvas id="tsIco" width="128" height="128"></canvas><div class="stats" id="tsStats"></div></div>
 <div class="row"><button class="btn g" id="tsUp">Upgrade</button><button class="btn r" id="tsSell">Sell</button></div>
</div>
<div class="screen on" id="title">
 <canvas id="logo" width="680" height="330"></canvas>
 <div class="sub" id="subT">ทหารกล้า ป้องกันฐาน</div>
 <div class="col">
  <button class="btn g" id="tPlay" style="font-size:24px;min-height:62px" data-t="Play">Play</button>
  <button class="btn b" id="tHow" data-t="How to play">How to play</button>
  <button class="btn gr" id="tSet" data-t="Settings">Settings</button>
  <div class="ver" style="text-align:center">Sandbag Siege v1.0.0</div>
 </div>
</div>
<div class="screen" id="maps">
 <h2 data-t="Choose a map">Choose a map</h2>
 <div id="mapList" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
 <button class="btn gr" id="mBack" style="min-width:200px;margin-top:6px" data-t="Back">Back</button>
</div>
<div class="modal" id="mPause"><div class="box">
 <h3 data-t="Paused">Paused</h3>
 <button class="btn g" id="pRes" data-t="Resume">Resume</button>
 <button class="btn b" id="pHow" data-t="How to play">How to play</button>
 <button class="btn gr" id="pSet" data-t="Settings">Settings</button>
 <button class="btn" id="pRestart" data-t="Restart">Restart</button>
 <button class="btn r" id="pQuit" data-t="Maps">Maps</button>
</div></div>
<div class="modal" id="mSet"><div class="box">
 <h3 data-t="Settings">Settings</h3>
 <div class="set"><span data-t="Language">Language</span><div class="seg"><button id="lTH">ไทย</button><button id="lEN">EN</button></div></div>
 <div class="set"><span data-t="Sound effects">Sound effects</span><div class="seg"><button id="sOn" data-t="On">On</button><button id="sOff" data-t="Off">Off</button></div></div>
 <div class="set"><span data-t="Music">Music</span><input type="range" id="mus" min="0" max="100" value="50"></div>
 <button class="btn g" id="setOk" data-t="OK">OK</button>
</div></div>
<div class="modal" id="mHow"><div class="box">
 <h3 data-t="How to play">How to play</h3>
 <ol class="how" id="howList"></ol>
 <button class="btn g" id="howOk" data-t="Got it!">Got it!</button>
</div></div>
<div class="modal" id="mEnd"><div class="box">
 <h3 id="eTitle">Level cleared!</h3>
 <div class="bigstars" id="eStars"><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span></div>
 <div id="eInfo" style="font-weight:800;font-size:16px"></div>
 <button class="btn b" id="eRev" style="display:none">Watch ad: +5 lives</button>
 <button class="btn g" id="eNext" data-t="Next map">Next map</button>
 <button class="btn" id="eRetry" data-t="Retry">Retry</button>
 <button class="btn gr" id="eMaps" data-t="Maps">Maps</button>
</div></div>
<div id="toast"></div>
<div id="banner"></div>
<!-- Hidden ad slot. The Android wrapper may call window.SANDBAG_setAdInset(px) to reserve room for a native banner. -->
<div id="ad-slot" aria-hidden="true" hidden></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const app=$("#app"),cv=$("#cv"),ctx=cv.getContext("2d");
const TAU=Math.PI*2, VW=400, VH=700;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
const angD=(a,b)=>{let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return d;};
const easeBack=t=>{const c=1.9; t=clamp(t,0,1); return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const fmt=n=>{n=Math.floor(n); return n>=10000?(n/1000).toFixed(1)+"K":String(n);};

// ===================== SAVE =====================
const save={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const PKEY="sandbagsiege_profile";
const devTH=/^th/i.test((navigator.languages&&navigator.languages[0])||navigator.language||"");
const profile=Object.assign({lang:devTH?"th":"en",sfx:true,music:0.5,stars:[0,0,0],unlocked:1,seenHow:false},save.get(PKEY,{})||{});
if(!Array.isArray(profile.stars)) profile.stars=[0,0,0];
function persist(){save.set(PKEY,profile);}

// ===================== I18N =====================
const TH={
"Wave":"คลื่น","Build a gun":"เลือกปืนที่จะสร้าง","Play":"เล่น","How to play":"วิธีเล่น","Settings":"ตั้งค่า","Choose a map":"เลือกแผนที่","Back":"กลับ",
"Paused":"หยุดชั่วคราว","Resume":"เล่นต่อ","Restart":"เริ่มใหม่","Maps":"แผนที่","Language":"ภาษา","Sound effects":"เสียงเอฟเฟกต์","Music":"ดนตรี",
"On":"เปิด","Off":"ปิด","OK":"ตกลง","Got it!":"เข้าใจแล้ว!","Next map":"แผนที่ถัดไป","Retry":"เล่นอีกครั้ง",
"Start wave":"เริ่มคลื่น","Next wave":"คลื่นถัดไป","early bonus":"โบนัสเรียกก่อน","Upgrade":"อัปเกรด","Sell":"ขาย","MAX":"เต็มแล้ว",
"Rifleman":"ทหารไรเฟิล","Machine gun":"ปืนกล","Sniper":"สไนเปอร์","Mortar":"ปืนครก","Rocket":"จรวด","Flamethrower":"พ่นไฟ","Anti-air":"ต่อสู้อากาศยาน","Tesla":"ปืนไฟฟ้า",
"Cheap all-rounder. Hits ground & air.":"ถูกและใช้ได้ทุกงาน ยิงได้ทั้งพื้นและอากาศ",
"Very fast fire. Weak vs armor.":"ยิงรัวมาก แต่อ่อนต่อเกราะ",
"Huge range & damage. Pierces armor.":"ระยะไกล ดาเมจสูง เจาะเกราะ",
"Splash shells. Ground only, can't hit close.":"กระสุนระเบิดเป็นวง ยิงพื้นเท่านั้น ยิงใกล้ไม่ได้",
"Homing anti-armor. Hits helicopters.":"จรวดนำวิถีเจาะเกราะ ยิงเฮลิคอปเตอร์ได้",
"Short range cone. Sets enemies on fire.":"ระยะสั้น พ่นเป็นกรวย ทำให้ศัตรูติดไฟ",
"Air only, shreds helicopters.":"ยิงอากาศเท่านั้น ถล่มเฮลิคอปเตอร์",
"Chain lightning. Hits ground & air.":"สายฟ้ากระโดดหลายเป้า ยิงได้ทั้งพื้นและอากาศ",
"Damage":"ดาเมจ","Range":"ระยะ","Fire rate":"อัตรายิง","Targets":"เป้าหมาย","Ground":"พื้น","Air":"อากาศ","Ground + Air":"พื้น + อากาศ",
"Level":"ระดับ","Not enough coins!":"เหรียญไม่พอ!","Level cleared!":"ผ่านด่าน!","HQ destroyed!":"กองบัญชาการถูกทำลาย!",
"Lives left":"ชีวิตที่เหลือ","Watch ad: +5 lives":"ดูโฆษณา: +5 ชีวิต","Wave clear!":"เคลียร์คลื่น!","BOSS INCOMING!":"บอสมาแล้ว!",
"Helicopters!":"เฮลิคอปเตอร์มา!","Armor incoming!":"ยานเกราะมา!","Locked":"ล็อกอยู่","waves":"คลื่น","Victory!":"ชนะ!",
"Green Valley":"หุบเขาเขียว","Desert Pass":"ช่องเขาทะเลทราย","Snow Ridge":"สันเขาหิมะ","Built!":"สร้างแล้ว!","Upgraded!":"อัปเกรดแล้ว!",
"Final wave!":"คลื่นสุดท้าย!","Wave":"คลื่น","Best":"ดีที่สุด"
};
const HOW={
en:["Enemy troops march along the road toward your HQ. Each one that gets in costs lives.",
 "Tap an empty sandbag pad and pick a gun. You must have enough coins to buy it.",
 "Every gun is different: machine guns shred infantry, snipers and rockets pierce armor, anti-air and rockets hit helicopters.",
 "Defeated enemies drop coins. Tap them to collect; any you miss are collected automatically after 4 seconds.",
 "Tap a built gun to see its range, upgrade it (3 levels) or sell it.",
 "Press Start wave. Call the next wave early for a coin bonus. Use 2x to speed up.",
 "Finish with more lives for more stars (up to 3) and unlock the next map."],
th:["ทหารศัตรูจะเดินตามถนนเข้ามาหากองบัญชาการ (HQ) ของเรา ถ้าหลุดเข้ามาได้จะเสียชีวิต",
 "แตะช่องกระสอบทรายที่ว่างแล้วเลือกปืน ต้องมีเหรียญพอถึงจะซื้อได้",
 "ปืนแต่ละแบบเก่งต่างกัน: ปืนกลกวาดทหารราบ, สไนเปอร์กับจรวดเจาะเกราะ, ต่อสู้อากาศยานกับจรวดยิงเฮลิคอปเตอร์",
 "ศัตรูที่ตายจะทิ้งเหรียญ แตะเพื่อเก็บ ถ้าไม่ได้แตะ ระบบจะเก็บให้เองใน 4 วินาที",
 "แตะปืนที่สร้างแล้วเพื่อดูระยะยิง อัปเกรด (3 ระดับ) หรือขายคืน",
 "กด 'เริ่มคลื่น' เรียกคลื่นถัดไปก่อนเวลาได้โบนัสเหรียญ กด 2x เพื่อเร่งความเร็ว",
 "เหลือชีวิตมาก ได้ดาวมาก (สูงสุด 3 ดาว) และปลดล็อกแผนที่ถัดไป"]};
function t(s){return profile.lang==="th"&&TH[s]!=null?TH[s]:s;}

// ===================== AUDIO =====================
const audio={ac:null,master:null,sfxG:null,musG:null,noise:null,nextBeat:0,beat:0,last:{},
 init(){ if(this.ac) return; try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; const ac=new AC(); this.ac=ac;
   this.master=ac.createGain(); this.master.gain.value=0.9; this.master.connect(ac.destination);

  if(c.t>=4) collectCoin(i,true); }

let DPR=1,CW=0,CH=0,S=1,OX=0,OY=0;
function resize(){ const r=cv.getBoundingClientRect(); CW=Math.max(1,r.width); CH=Math.max(1,r.height); DPR=Math.min(2,window.devicePixelRatio||1); cv.width=Math.round(CW*DPR); cv.height=Math.round(CH*DPR);
 const top=50, bot=G.mode==="title"?0:66; S=Math.min(CW/VW,(CH-top-bot)/VH); OX=(CW-VW*S)/2; OY=top+((CH-top-bot)-VH*S)/2; bg=null; }
function w2s(x,y){ return {x:OX+x*S,y:OY+y*S}; }
function s2w(x,y){ return {x:(x-OX)/S,y:(y-OY)/S}; }
function render(time){ const g=ctx; g.setTransform(1,0,0,1,0,0);

 g.drawImage(getBg(),sx*DPR,sy*DPR);
 g.setTransform(DPR*S,0,0,DPR*S,DPR*(OX+sx),DPR*(OY+sy));
 const m=G.m;
 m.pads.forEach((p,i)=>{ if(G.padT[i]<0) drawPad(g,p,i,time); });
 drawHQ(g,m,time);
 // selected range
 if(G.sel&&G.sel.kind==="tw"){ const tw=G.T[G.sel.i]; if(tw){ const st=stats(tw); g.fillStyle="rgba(255,255,255,.12)"; g.strokeStyle="rgba(255,255,255,.75)"; g.lineWidth=1.6; g.setLineDash([6,4]); g.beginPath(); g.arc(tw.x,tw.y,st.range,0,TAU); g.fill(); g.stroke(); g.setLineDash([]); if(st.min){ g.fillStyle="rgba(255,60,40,.18)"; g.beginPath(); g.arc(tw.x,tw.y,st.min,0,TAU); g.fill(); } } }
 for(const e of G.E) if(!e.air) drawEnemy(g,e,time);
 for(const tw of G.T) drawTower(g,tw,time);
 // particles (ground-level)
 for(const p of G.P){ const u=p.life/p.max; switch(p.type){
  case "smoke": g.globalAlpha=u*0.45; circ(g,p.x,p.y,p.size*(1.6-u*0.6),p.col); break;
  case "dust": g.globalAlpha=u*0.7; circ(g,p.x,p.y,p.size*(1.4-u*0.4),p.col); break;
  case "fire": case "flame": g.globalAlpha=Math.min(1,u*1.4); circ(g,p.x,p.y,p.size*(p.type==="flame"?(1.6-u):u+0.3),p.col); break;
  case "flash": g.globalAlpha=u; circ(g,p.x,p.y,p.size*(1.2-u*0.4),p.col); break;
  case "spark": g.globalAlpha=u; g.strokeStyle=p.col; g.lineWidth=1.3; g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(p.x-p.vx*0.04,p.y-p.vy*0.04); g.stroke(); break;
  case "debris": case "helm": g.globalAlpha=Math.min(1,u*2); g.save(); g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.col; if(p.type==="helm"){ g.beginPath(); g.arc(0,0,p.size,Math.PI,0); g.fill(); } else g.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.7); g.restore(); break; } }
 g.globalAlpha=1;
 // rings
 for(const r of G.rings){ const u=r.t/r.T; g.globalAlpha=1-u; g.strokeStyle="#fff3c0"; g.lineWidth=3*(1-u)+0.5; g.beginPath(); g.arc(r.x,r.y,r.r*(0.3+u),0,TAU); g.stroke(); } g.globalAlpha=1;

 g.textAlign="center"; g.textBaseline="middle"; for(const tx of G.texts){ const u=tx.t/0.9; g.globalAlpha=1-u*u; g.font="900 "+Math.round(12*tx.sc)+"px system-ui,sans-serif"; g.lineWidth=3; g.strokeStyle="rgba(0,0,0,.7)"; g.strokeText(tx.s,tx.x,tx.y-u*18); g.fillStyle=tx.col; g.fillText(tx.s,tx.x,tx.y-u*18); } g.globalAlpha=1;

}

let coinTgt={x:60,y:25};
function updCoinTgt(){ const a=app.getBoundingClientRect(), r=$("#coinIco").getBoundingClientRect(); if(r.width) coinTgt={x:r.left-a.left+r.width/2,y:r.top-a.top+r.height/2}; else coinTgt={x:110,y:25}; }
function collectCoin(i,auto){ const c=G.coinsG[i]; G.coinsG.splice(i,1); const s=w2s(c.x,c.y-c.z); G.fly.push({sx:s.x,sy:s.y,tx:coinTgt.x,ty:coinTgt.y,t:0,v:c.v,cx:rand(-40,40),sp:auto?1.6:2.2}); if(!auto) sfx("coin"); }
function flyBonus(v,x,y){ const n=Math.min(8,Math.max(3,Math.round(v/8))); const s=w2s(x,y); for(let i=0;i<n;i++){ const part=Math.floor(v/n)+(i<v%n?1:0); G.fly.push({sx:s.x+rand(-30,30),sy:s.y+rand(-20,20),tx:coinTgt.x,ty:coinTgt.y,t:-i*0.06,v:part,cx:rand(-60,60),sp:1.7}); } }
function updFly(dt){ for(let i=G.fly.length-1;i>=0;i--){ const f=G.fly[i]; f.t+=dt*f.sp; if(f.t>=1){ G.fly.splice(i,1); G.coins+=f.v; bumpCoins(); } } }
let bumpT=0; function bumpCoins(){ hudDirty=true; const now=performance.now(); if(now-bumpT>90){ bumpT=now; const p=$("#coinPill"); p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop"); sfx("coin"); } }

function toast(s){ const el=$("#toast"); el.textContent=s; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("on"),1500); }
function banner(s,red){ const el=$("#banner"); el.textContent=s; el.classList.toggle("red",!!red); el.classList.add("on"); clearTimeout(banner.t); banner.t=setTimeout(()=>el.classList.remove("on"),1300); }
function drawIcon(c,ti,lv){ const g=c.getContext("2d"); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,c.width,c.height); const k=c.width/48; g.setTransform(k,0,0,k,24*k,25*k); drawTowerBody(g,ti,lv||1,-Math.PI/4,1.2,0,false,false); }
function buildCards(){ const gr=$("#buildGrid"); gr.innerHTML=""; TT.forEach((T,i)=>{ const d=document.createElement("div"); d.className="card"; d.dataset.i=i; d.innerHTML='<canvas width="96" height="96"></canvas><div class="nm"></div><div class="pr"><span class="coin"></span><span></span></div>'; drawIcon(d.querySelector("canvas"),i,1); d.querySelector(".nm").textContent=t(T.name); d.querySelector(".pr span:last-child").textContent=T.cost; d.onclick=()=>buyTower(i); gr.appendChild(d); }); }
function refreshBuild(){ document.querySelectorAll("#buildGrid .card").forEach(d=>{ const T=TT[+d.dataset.i]; d.classList.toggle("no",G.coins<T.cost); d.querySelector(".nm").textContent=t(T.name); }); }
function openBuild(p){ closeSheets(); G.sel={kind:"pad",i:p}; refreshBuild(); $("#buildSheet").classList.add("on"); $("#bottom").classList.remove("on"); sfx("click"); }
function buyTower(ti){ if(!G.sel||G.sel.kind!=="pad") return; const T=TT[ti]; if(G.coins<T.cost){ sfx("deny"); toast(t("Not enough coins!")); const c=document.querySelector('#buildGrid .card[data-i="'+ti+'"]'); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); return; }
 placeTower(G.sel.i,ti,false); closeSheets(); hudDirty=true; sfx("click"); }
function openTow(i){ closeSheets(); G.sel={kind:"tw",i}; refreshTow(); $("#towSheet").classList.add("on"); $("#bottom").classList.remove("on"); sfx("click"); }
function refreshTow(){ const tw=G.T[G.sel&&G.sel.i]; if(!tw) return; const T=TT[tw.T], st=stats(tw); $("#tsName").textContent=t(T.name)+" · "+t("Level")+" "+tw.lv;
 drawIcon($("#tsIco"),tw.T,tw.lv);
 const tg=T.air&&T.gnd?"Ground + Air":T.air?"Air":"Ground"; const rate=T.id==="flame"?"—":st.rate.toFixed(1)+"/s";
 $("#tsStats").innerHTML=t("Damage")+": <b>"+Math.round(st.dmg)+(T.id==="flame"?"/s":"")+"</b> &nbsp; "+t("Range")+": <b>"+Math.round(st.range)+"</b><br>"+t("Fire rate")+": <b>"+rate+"</b> &nbsp; "+t("Targets")+": <b>"+t(tg)+"</b><div class='desc'></div>";
 $("#tsStats .desc").textContent=t(T.desc);
 const u=$("#tsUp"), c=upCost(tw); if(tw.lv>=3){ u.innerHTML=t("MAX"); u.disabled=true; } else { u.innerHTML=t("Upgrade")+'<small><span class="coin" style="width:12px;height:12px;vertical-align:-1px"></span> '+c+'</small>'; u.disabled=G.coins<c; }
 $("#tsSell").innerHTML=t("Sell")+'<small>+'+sellVal(tw)+'</small>'; }
function closeSheets(){ $("#buildSheet").classList.remove("on"); $("#towSheet").classList.remove("on"); G.sel=null; if(G.mode==="play") $("#bottom").classList.add("on"); }
$("#bsX").onclick=()=>{closeSheets();sfx("click");}; $("#tsX").onclick=()=>{closeSheets();sfx("click");};
$("#tsUp").onclick=()=>{ const tw=G.T[G.sel&&G.sel.i]; if(!tw||tw.lv>=3) return; const c=upCost(tw); if(G.coins<c){ sfx("deny"); toast(t("Not enough coins!")); return; } G.coins-=c; tw.spent+=c; tw.lv++; tw.pop=0.4; for(let i=0;i<14;i++){ const a=rand(0,TAU); part(tw.x,tw.y,Math.cos(a)*70,Math.sin(a)*70,0.5,2.5,"#ffe27a","spark"); } addText(tw.x,tw.y-22,t("Upgraded!"),"#ffe27a",1.1); sfx("upgrade"); hudDirty=true; refreshTow(); };
$("#tsSell").onclick=()=>{ const i=G.sel&&G.sel.i, tw=G.T[i]; if(!tw) return; const v=sellVal(tw); for(let k=0;k<10;k++) part(tw.x,tw.y,rand(-50,50),rand(-50,50),0.5,6,"#d9c79a","dust"); G.T.splice(i,1); reindex(); flyBonus(v,tw.x,tw.y); sfx("sell"); closeSheets(); hudDirty=true; };
$("#waveBtn").onclick=()=>{ audio.init(); audio.resume(); callWave(); };
$("#bSpeed").onclick=()=>{ G.speed=G.speed===1?2:1; hudDirty=true; sfx("click"); };
$("#bPause").onclick=()=>pause();
function pause(){ if(G.mode!=="play"||G.paused) return; G.paused=true; $("#mPause").classList.add("on"); }
function resume(){ G.paused=false; $("#mPause").classList.remove("on"); }
$("#pRes").onclick=()=>{resume();sfx("click");};
$("#pRestart").onclick=()=>{ resume(); startLevel(G.mi); showPlay(); };
$("#pQuit").onclick=()=>{ resume(); showMaps(); };
$("#pSet").onclick=()=>openSet(); $("#pHow").onclick=()=>openHow(); $("#tSet").onclick=()=>openSet(); $("#tHow").onclick=()=>openHow();
function openSet(){ audio.init(); refreshSet(); $("#mSet").classList.add("on"); }
function refreshSet(){ $("#lTH").classList.toggle("on",profile.lang==="th"); $("#lEN").classList.toggle("on",profile.lang==="en"); $("#sOn").classList.toggle("on",profile.sfx); $("#sOff").classList.toggle("on",!profile.sfx); $("#mus").value=Math.round(profile.music*100); }
$("#lTH").onclick=()=>{profile.lang="th";persist();applyLang();refreshSet();}; $("#lEN").onclick=()=>{profile.lang="en";persist();applyLang();refreshSet();};
$("#sOn").onclick=()=>{profile.sfx=true;persist();refreshSet();sfx("click");}; $("#sOff").onclick=()=>{profile.sfx=false;persist();refreshSet();};
$("#mus").oninput=e=>{ profile.music=clamp(+e.target.value/100,0,1); audio.setMusic(); persist(); };
$("#setOk").onclick=()=>{ $("#mSet").classList.remove("on"); sfx("click"); };
function openHow(){ const L=$("#howList"); L.innerHTML=""; HOW[profile.lang==="th"?"th":"en"].forEach(s=>{ const li=document.createElement("li"); li.textContent=s; L.appendChild(li); }); $("#mHow").classList.add("on"); }
$("#howOk").onclick=()=>{ $("#mHow").classList.remove("on"); profile.seenHow=true; persist(); sfx("click"); };
function applyLang(){ document.documentElement.lang=profile.lang; document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t)); $("#subT").textContent=profile.lang==="th"?"ทหารกล้า ป้องกันฐาน":"Hold the line. Defend the HQ."; buildCards(); hudDirty=true; if($("#maps").classList.contains("on")) showMaps(); if($("#mHow").classList.contains("on")) openHow(); }
function titleOn(){ return $("#title").classList.contains("on")||$("#maps").classList.contains("on"); }
function setScreen(id){ ["#title","#maps"].forEach(s=>$(s).classList.toggle("on",s==="#"+id)); const play=id==="play"; $("#hud").classList.toggle("on",play); $("#bottom").classList.toggle("on",play); if(!play) closeSheets(); resize(); }
function showTitle(){ if(!G.demo||G.mi!==0) startLevel(0,true); G.mode="title"; setScreen("title"); }
function showMaps(){ $("#mEnd").classList.remove("on"); if(!G.demo) startLevel(0,true); G.mode="title"; setScreen("maps"); const L=$("#mapList"); L.innerHTML="";
 MAPS.forEach((m,i)=>{ const lock=i>=profile.unlocked; const d=document.createElement("div"); d.className="mcard"+(lock?" lock":""); const st=profile.stars[i]||0;
  d.innerHTML='<canvas width="152" height="240"></canvas><div><div class="mn"></div><div class="ms"></div><div class="stars">'+[0,1,2].map(k=>'<span class="'+(k<st?"on":"")+'">&#9733;</span>').join("")+'</div></div>';
  d.querySelector(".mn").textContent=(i+1)+". "+t(m.name); d.querySelector(".ms").textContent=lock?t("Locked"):m.waves+" "+t("waves");
  const c=d.querySelector("canvas"), g=c.getContext("2d"); const k=152/VW*1.0; g.setTransform(k,0,0,k*240/152/(VH/VW)*1,0,0); g.setTransform(152/VW,0,0,240/VH,0,0); paintMap(g,m,i); m.pads.forEach((p,j)=>drawPad(g,p,-1,0)); drawHQ(g,m,0);
  if(!lock) d.onclick=()=>{ sfx("click"); startLevel(i); showPlay(); }; L.appendChild(d); }); }
function showPlay(){ setScreen("play"); G.mode="play"; hudDirty=true; lastBusy=null; updCoinTgt(); if(!profile.seenHow&&G.mi===0) openHow(); }
$("#tPlay").onclick=()=>{ audio.init(); audio.resume(); sfx("click"); showMaps(); };
$("#mBack").onclick=()=>{ sfx("click"); showTitle(); };

// ===================== END =====================
function starsFor(l){ return l>=17?3:l>=8?2:1; }
function endLevel(win){ G.mode="end"; closeSheets(); $("#bottom").classList.remove("on"); const box=$("#mEnd"); ADS.levelEnd(win?1:0);
 $("#eTitle").textContent=win?t("Level cleared!"):t("HQ destroyed!"); const st=win?starsFor(G.lives):0;
 if(win){ profile.stars[G.mi]=Math.max(profile.stars[G.mi]||0,st); profile.unlocked=Math.max(profile.unlocked,Math.min(MAPS.length,G.mi+2)); persist(); sfx("win"); } else sfx("lose");
 const ss=$("#eStars").children; for(let k=0;k<3;k++){ ss[k].className=""; ss[k].style.animationDelay=(0.25+k*0.25)+"s"; void ss[k].offsetWidth; ss[k].className=(k<st?"on ":"")+"in"; }
 $("#eStars").style.display=win?"":"none";
 $("#eInfo").textContent=win?t("Lives left")+": "+G.lives+"/20":t("Wave")+" "+G.wave+"/"+G.N;
 $("#eNext").style.display=win&&G.mi<MAPS.length-1?"":"none";
 $("#eRev").textContent=t("Watch ad: +5 lives"); adsRwRefresh();
 setTimeout(()=>box.classList.add("on"),win?500:800); }
$("#eNext").onclick=()=>{ sfx("click"); $("#mEnd").classList.remove("on"); maybeInterstitial(()=>{ startLevel(G.mi+1); showPlay(); }); };
$("#eRetry").onclick=()=>{ sfx("click"); $("#mEnd").classList.remove("on"); maybeInterstitial(()=>{ startLevel(G.mi); showPlay(); }); };
$("#eMaps").onclick=()=>{ sfx("click"); $("#mEnd").classList.remove("on"); maybeInterstitial(()=>showMaps()); };

// ===================== ADS (hooks only; silent no-ops in a normal browser) =====================
// The Android wrapper may inject window.AndroidAds {showInterstitial, hasRewarded, showRewarded} and call back
// window.Ads.closeInterstitial(), Ads.onReward(), Ads.onRewardUnavailable(), Ads.closeRewarded() (same contract as Dropaboom / Turret Tide).
function adsHas(fn){ try{ return !!(window.AndroidAds&&typeof window.AndroidAds[fn]==="function"); }catch(e){ return false; } }
const ADS={showing:false,after:null,afterTO:0,levelId:0,rwDone:-1,rwBusy:false,lost:false,ends:0,sessionEnds:0,
 levelEnd(win){ this.levelId++; this.lost=!win; this.ends++; this.sessionEnds++; this.rwBusy=false; }};
const AD_LAST_KEY="sandbagsiege_ad_last";
function rwAvailable(){ try{ return adsHas("showRewarded")&&(!adsHas("hasRewarded")||!!window.AndroidAds.hasRewarded()); }catch(e){ return false; } }
function adsRwRefresh(){ const b=$("#eRev"); const ok=G.mode==="end"&&ADS.lost&&!G.revived&&ADS.rwDone!==ADS.levelId&&rwAvailable(); b.style.display=ok?"":"none"; if(ok) b.disabled=ADS.rwBusy; }
$("#eRev").onclick=function(){ if(ADS.rwBusy||ADS.showing||ADS.rwDone===ADS.levelId||!rwAvailable()){ this.style.display="none"; return; }
 sfx("click"); ADS.rwBusy=true; ADS.showing=true; this.disabled=true; audio.suspend(); try{ window.AndroidAds.showRewarded(); }catch(e){ adsRwUnavailable(); } };
function adsRwGrant(){ if(ADS.rwDone===ADS.levelId||!ADS.rwBusy) return false; ADS.rwDone=ADS.levelId; save.set(AD_LAST_KEY,Date.now());
 G.revived=true; G.lives=5; G.E.forEach(e=>{ if(e.prog>G.m.len*0.8){ e.dead=true; waveDone(e.w); } }); G.E=G.E.filter(e=>!e.dead); G.winT=-1;
 $("#mEnd").classList.remove("on"); G.mode="play"; $("#bottom").classList.add("on"); hudDirty=true; toast("+5 ♥"); return true; }
function adsRwUnavailable(){ ADS.rwBusy=false; ADS.showing=false; audio.resume(); $("#eRev").style.display="none"; }
function adsRwClosed(){ ADS.rwBusy=false; ADS.showing=false; audio.resume(); adsRwRefresh(); }
function maybeInterstitial(after){ let ok=adsHas("showInterstitial")&&!ADS.showing&&ADS.sessionEnds>2&&ADS.ends>=3&&ADS.rwDone!==ADS.levelId;
 const last=Number(save.get(AD_LAST_KEY,0))||0; if(ok&&last<=Date.now()&&Date.now()-last<180000) ok=false;
 if(!ok){ after(); return; } ADS.ends=0; save.set(AD_LAST_KEY,Date.now()); ADS.showing=true; ADS.after=after; audio.suspend();
 clearTimeout(ADS.afterTO); ADS.afterTO=setTimeout(adsInterClosed,90000); try{ window.AndroidAds.showInterstitial(); }catch(e){ adsInterClosed(); } }
function adsInterClosed(){ if(!ADS.showing&&!ADS.after) return; clearTimeout(ADS.afterTO); ADS.showing=false; const f=ADS.after; ADS.after=null; audio.resume(); if(f) try{ f(); }catch(e){} }
window.Ads=Object.assign(window.Ads||{},{ closeInterstitial(){ adsInterClosed(); }, onReward(){ adsRwGrant(); }, onRewardUnavailable(){ adsRwUnavailable(); }, closeRewarded(){ adsRwClosed(); } });
window.SANDBAG_setAdInset=function(px){ px=Math.max(0,Math.min(200,Number(px)||0)); app.style.setProperty("--ad-h",px+"px"); const s=$("#ad-slot"); if(px>0) s.removeAttribute("hidden"); else s.setAttribute("hidden",""); resize(); updCoinTgt(); };
window.SANDBAG_onBackground=function(){ pause(); persist(); audio.suspend(); };
window.SANDBAG_onForeground=function(){ audio.resume(); };
window.SANDBAG_onBack=function(){ return handleBack(); };
function handleBack(){ // returns true if handled (app should not exit)
 for(const id of ["#mHow","#mSet"]) if($(id).classList.contains("on")){ $(id).classList.remove("on"); return true; }
 if($("#buildSheet").classList.contains("on")||$("#towSheet").classList.contains("on")){ closeSheets(); return true; }
 if($("#mPause").classList.contains("on")){ resume(); return true; }
 if(G.mode==="play"){ pause(); return true; }
 if($("#mEnd").classList.contains("on")){ $("#mEnd").classList.remove("on"); showMaps(); return true; }
 if($("#maps").classList.contains("on")){ showTitle(); return true; }
 return false; }
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ pause(); persist(); audio.suspend(); } else audio.resume(); });

// ===================== INPUT =====================
cv.addEventListener("pointerdown",ev=>{ audio.init(); audio.resume(); if(G.mode!=="play"||G.paused) return; const r=cv.getBoundingClientRect(); const w=s2w(ev.clientX-r.left,ev.clientY-r.top);
 // coins first (generous radius)
 let got=0; for(let i=G.coinsG.length-1;i>=0;i--){ const c=G.coinsG[i]; if(Math.hypot(c.x-w.x,c.y-c.z-w.y)<26){ collectCoin(i,false); got++; } } if(got) return;
 for(let i=0;i<G.T.length;i++){ const tw=G.T[i]; if(Math.hypot(tw.x-w.x,tw.y-w.y)<24){ if(G.sel&&G.sel.kind==="tw"&&G.sel.i===i) closeSheets(); else openTow(i); return; } }
 for(let i=0;i<G.m.pads.length;i++){ const p=G.m.pads[i]; if(G.padT[i]<0&&Math.hypot(p.x-w.x,p.y-w.y)<24){ openBuild(i); return; } }
 if(G.sel) closeSheets(); });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"){ handleBack(); } });

// ===================== LOGO =====================
function drawLogo(){ const c=$("#logo"), g=c.getContext("2d"); const W=c.width,H=c.height; g.clearRect(0,0,W,H);
 g.save(); g.translate(W/2,H/2+6);
 // camo plate
 g.save(); g.rotate(-0.03); rr(g,-300,-92,600,170,26); g.fillStyle="#4f6b22"; g.fill(); g.save(); g.clip(); const R=rng(5); for(let i=0;i<40;i++) ell(g,R()*640-320,R()*200-100,R()*50+20,R()*22+10,["#3c5418","#6c8a33","#2e3f14","#7f8f45"][i%4],R()*3); g.restore();
 g.lineWidth=8; g.strokeStyle="#2a3510"; rr(g,-300,-92,600,170,26); g.stroke(); g.lineWidth=3; g.strokeStyle="#c9b071"; rr(g,-288,-80,576,146,18); g.stroke(); g.restore();
 // sandbags row
 for(let i=0;i<13;i++){ const x=-264+i*44, y=96; g.save(); g.translate(x,y); ell(g,0,4,24,13,"rgba(0,0,0,.35)"); ell(g,0,0,24,14,"#dcc38c"); g.lineWidth=3; g.strokeStyle="#8f7446"; g.stroke(); g.beginPath(); g.moveTo(-10,-3); g.lineTo(10,-3); g.strokeStyle="rgba(255,255,255,.4)"; g.stroke(); g.restore(); }
 // stars
 const star=(x,y,r,f)=>{ g.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr2=i%2?r*0.42:r; g.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);} g.closePath(); g.fillStyle=f; g.fill(); g.lineWidth=4; g.strokeStyle="#5a3a00"; g.stroke(); };
 star(-250,-14,34,"#ffd447"); star(250,-14,34,"#ffd447");
 // text
 const word=(s,y,size,fill1,fill2)=>{ g.font="900 "+size+"px Impact,'Arial Black','Segoe UI Black',system-ui,sans-serif"; g.textAlign="center"; g.textBaseline="middle"; let w=g.measureText(s).width; const maxW=410; const sc=Math.min(1,maxW/w); g.save(); g.scale(sc,1);
  g.lineJoin="round"; g.lineWidth=16; g.strokeStyle="#1f2a0a"; g.strokeText(s,0,y+4); g.lineWidth=10; g.strokeStyle="#2a1a00"; g.strokeText(s,0,y);
  const gr=g.createLinearGradient(0,y-size/2,0,y+size/2); gr.addColorStop(0,fill1); gr.addColorStop(1,fill2); g.fillStyle=gr; g.fillText(s,0,y);
  g.globalAlpha=0.3; g.fillStyle="#fff"; g.save(); g.beginPath(); g.rect(-400,y-size/2,800,size*0.38); g.clip(); g.fillText(s,0,y); g.restore(); g.globalAlpha=1; g.restore(); };
 word("SANDBAG",-36,86,"#fff3b0","#ffb92e"); word("SIEGE",44,92,"#ffe27a","#ff7a1a");
 g.restore(); }

// ===================== LOOP =====================
let lastT=performance.now(), acc=0; const STEP=1/60;
function frame(now){ requestAnimationFrame(frame); let dt=Math.min(0.1,(now-lastT)/1000); lastT=now;
 const running=(G.mode==="play"&&!G.paused)||G.mode==="title"||(G.mode==="end");
 if(running&&!ADS.showing){ acc+=dt*(G.mode==="play"?G.speed:1); let n=0; while(acc>=STEP&&n<6){ update(STEP); acc-=STEP; n++; } if(n>=6) acc=0; updFly(dt); }
 busyWatch(); updHud(); render(now/1000); audio.music(); }
window.addEventListener("resize",()=>{ resize(); updCoinTgt(); });

// ===================== TEST HOOK =====================
window.SB={G,MAPS,TT,ET,profile,w2s,s2w,stats,upCost,sellVal,callWave,
 tick(sec){ const n=Math.round(sec/STEP); for(let i=0;i<n;i++){ update(STEP); updFly(STEP); } busyWatch(); updHud(); render(performance.now()/1000); },
 state(){ return {mode:G.mode,mi:G.mi,coins:G.coins,lives:G.lives,wave:G.wave,N:G.N,E:G.E.length,q:G.queue.length,T:G.T.map(t=>t.T+":"+t.lv),coinsG:G.coinsG.length,fly:G.fly.length,shells:G.shells.length,rockets:G.rockets.length,tracers:G.tracers.length,bolts:G.bolts.length,P:G.P.length,paused:G.paused,winT:G.winT}; }};

// ===================== BOOT =====================
applyLang(); drawLogo(); resize(); startLevel(0,true); setScreen("title"); updCoinTgt(); requestAnimationFrame(frame);
</script>
